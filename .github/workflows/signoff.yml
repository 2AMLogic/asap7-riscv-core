name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/asap7-riscv-core.json) and byte-compare the fresh output against
# the committed verdict-of-record (manifests/asap7-riscv-core.signoff.json).
#
# A manifest edit, a change to a cited artifact, or a change to the vendored
# tiers doc makes the fresh render differ from the committed record, and this
# check fails rather than letting the record rot: regenerate the record in the
# same PR so the drift lands in the diff for a reviewer to see.
#
# See manifests/README.md for pins and provenance.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: |
          pip install klayout-tools==0.8.0
          klt --version

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-riscv-core.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at least
          # one item is unmet. Both are valid runs of the grader. Anything
          # else is a hard error (manifest or doc unreadable, evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/asap7-riscv-core.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/asap7-riscv-core.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/asap7-riscv-core.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/asap7-riscv-core.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/asap7-riscv-core.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
          python3 -c "import json; d=json.load(open('manifests/asap7-riscv-core.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"

      # Item 10 (repo hygiene) is attested by klt, not hand-read. --check
      # re-attests the committed envelope: every hygiene file is re-hashed and
      # any change is drift. The harness commands in attest/item10.json are
      # local_only (they need iverilog/verilator), so they are skipped here and
      # listed as [SKIP]; the harness runs in ci.yml instead. After editing
      # README.md, LICENSE or either workflow, re-attest and commit:
      #   klt signoff --attest 10 --inventory attest/item10.json -o evidence/item10.json
      - name: Re-check the item 10 attestation envelope
        run: |
          klt signoff --attest 10 --inventory attest/item10.json \
                      --check evidence/item10.json
