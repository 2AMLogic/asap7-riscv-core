name: harness

# Keeps the PDK-free verification harness (cocotb + Icarus, Verilator lint)
# runnable from a cold clone. It calls verification/run.sh only, never its
# internals, so changes to the harness do not need an edit here.
#
# run.sh refuses any iverilog / verilator / python other than the versions in
# verification/tool-versions.txt, and stock ubuntu-latest apt packages do not
# match them. The job therefore builds the pinned releases from their upstream
# tags and caches the install prefix, keyed on tool-versions.txt.
#
# The harness makes no claim about any design; see verification/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Decision records are cited as authority in this repo, so a number that
      # names two records makes every bare "decision NNNN" citation of it
      # unresolvable. spec/decisions/ holds exactly one deliberate, recorded
      # collision - two records share 0012, documented in spec/README.md
      # ("Recorded collision: two records share 0012") and deliberately not
      # renumbered, because a committed record is not rewritten. That pair is
      # allowlisted by its two exact filenames, so a third 0012, or a collision
      # on any other number, still fails. Runs before the toolchain build so a
      # docs-only mistake does not cost a 40-minute Verilator compile.
      - name: Decision record numbers are unique
        run: |
          set -euo pipefail
          allowed_number='0012'
          allowed_files='0012-pin-klt-0-9-0-and-ratify-asap7-drc-deck.md 0012-shared-archtest-module-and-item9-reattestation.md'
          shopt -s nullglob
          declare -A records=()
          for f in spec/decisions/[0-9][0-9][0-9][0-9]-*.md; do
            base="${f##*/}"
            n="${base:0:4}"
            records[$n]="${records[$n]:+${records[$n]} }$base"
          done
          [ "${#records[@]}" -gt 0 ] || { echo "::error::no NNNN-*.md records found under spec/decisions/"; exit 1; }
          rc=0
          while read -r n; do
            files="${records[$n]}"
            case "$files" in *' '*) ;; *) continue ;; esac
            if [ "$n" = "$allowed_number" ] && [ "$files" = "$allowed_files" ]; then
              echo "decision number $n: the recorded collision, allowlisted ($files) - see spec/README.md"
              continue
            fi
            echo "::error file=spec/README.md::decision number $n names more than one record: $files"
            rc=1
          done < <(printf '%s\n' "${!records[@]}" | sort)
          if [ "$rc" -ne 0 ]; then
            echo 'A decision number must name exactly one record: a bare "decision NNNN" citation'
            echo 'cannot resolve against a collision. Give the new record the lowest unused number'
            echo '(spec/README.md, "Decision record numbering", has the one-liner), or cite by path link.'
            echo "The only allowlisted collision is $allowed_number ($allowed_files),"
            echo 'recorded in spec/README.md. Adding to that allowlist needs a decision record.'
            exit 1
          fi
          echo "Decision record numbers are unique (the recorded $allowed_number collision aside)."

      - name: Read pinned tool versions
        id: pins
        run: |
          set -euo pipefail
          for t in iverilog verilator python; do
            v="$(sed -n "s/^$t=//p" verification/tool-versions.txt)"
            [ -n "$v" ] || { echo "::error::no $t pin in verification/tool-versions.txt"; exit 1; }
            echo "$t=$v" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Restore pinned simulators
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: sim-tools-${{ runner.os }}-iverilog-${{ steps.pins.outputs.iverilog }}-verilator-${{ steps.pins.outputs.verilator }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache flex gperf git help2man \
            libfl-dev libfl2 perl python3 zlib1g-dev

      - name: Build pinned Icarus Verilog
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="v$(echo '${{ steps.pins.outputs.iverilog }}' | tr . _)"
          git clone --depth 1 --branch "$tag" https://github.com/steveicarus/iverilog.git "$RUNNER_TEMP/iverilog"
          cd "$RUNNER_TEMP/iverilog"
          sh autoconf.sh
          ./configure --prefix="$HOME/tools"
          make -j2
          make install

      - name: Build pinned Verilator
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${{ steps.pins.outputs.verilator }}" https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          autoconf
          ./configure --prefix="$HOME/tools"
          make -j2
          make install

      - name: Put pinned simulators on PATH
        run: echo "$HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Harness (lint + cocotb test)
        run: verification/run.sh

      - name: Harness negative control (must see the test fail)
        run: verification/run.sh --negative-control
